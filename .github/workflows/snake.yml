name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"     # diario (UTC)
  workflow_dispatch:         # permitir ejecutarlo manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para pushear a la rama output

    steps:
      # Usa el token integrado del workflow: no vence y alcanza para leer
      # el calendario de contribuciones (incluye privadas si están activadas
      # en la configuración del perfil).
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ron-25
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2f81f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
