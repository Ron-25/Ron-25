name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas (UTC)
  workflow_dispatch:          # permitir ejecutarlo manualmente

# Evita que dos ejecuciones hagan commit al mismo tiempo
concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Falla rápido y con un mensaje claro si el token no sirve,
      # en vez de esperar ~15 min de reintentos con "Bad credentials".
      - name: Verificar METRICS_TOKEN
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto METRICS_TOKEN. Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          status=$(curl -s -o /dev/null -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
          if [ "$status" != "200" ]; then
            echo "::error::METRICS_TOKEN es inválido o está vencido (HTTP $status). Genera un PAT classic nuevo con los permisos 'repo' y 'read:user' y reemplaza el secreto."
            exit 1
          fi
          expires=$(grep -i '^github-authentication-token-expiration:' headers.txt | cut -d' ' -f2- | tr -d '\r')
          echo "Token válido. Expira: ${expires:-sin fecha de vencimiento}"

      # Tarjeta 1: resumen del perfil + calendario anual de contribuciones
      - name: Métricas — resumen
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ron-25
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Panama
          retries: 2
          retries_delay: 30

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          output_action: commit
          committer_branch: main
          filename: github-metrics.svg

      # Tarjeta 2: lenguajes, issues/PRs y logros
      - name: Métricas — lenguajes y logros
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ron-25
          template: classic
          base: ""
          config_timezone: America/Panama
          retries: 2
          retries_delay: 30

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile, cmake

          plugin_followup: yes
          plugin_followup_sections: user

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8

          output_action: commit
          committer_branch: main
          filename: metrics-insights.svg
